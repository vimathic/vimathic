name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Cancel any in-progress runs for the same PR/branch when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Math validation tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        # Runs every tests/*.test.js — the whole unit suite, not only the maths.
        # FIX(#44, r4): this comment used to state a fixed total, and it was
        # hundreds short by the time anyone read it. It is the only statement in
        # the workflow of what this required check covers, and the job's name
        # understates it too — but the name is what the branch-protection rule
        # matches on, so it cannot be corrected here alone. That left a reader
        # with a name and a number that both said "narrower than it is". The
        # scope is the glob; the count is whatever the run prints.
        # The largest single file is tests/math-validation.test.js, which
        # validates math-collections.js against canonical references
        # (scipy.special, mpmath, NIST DLMF).
        run: npm test

  e2e:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    # This is the JOB budget. The PER-TEST budget is in playwright.config.js and
    # is a different number for CI — the two are sized against each other, so
    # move them together.
    #
    # 30, not 15: at one worker on a GPU-less runner the suite needs ~3-4 min
    # of wall clock locally and every failure costs two retries on top, and the
    # 15-minute budget this job was given ran out mid-run — the job was killed
    # with "exceeded the maximum execution time" and reported nothing at all,
    # which reads exactly like a product failure and is not one.
    timeout-minutes: 30
    # continue-on-error was removed here: it had been masking a real product
    # regression (RESET ALL restored colour scheme 0 instead of 16) plus three
    # tests that no longer matched the UI, so the suite was red and nobody saw
    # it. The 8 smoke tests pass again (14 e2e in total with the clip-camera
    # suite), and hosted runners have no GPU either, so the single-worker
    # setting in playwright.config.js is what keeps them stable.
    # Restore this line only as a deliberate, temporary decision — not as the
    # default place for e2e to live.
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

  build:
    name: Vite build (single-file)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test

    # Build job runs as CI verification only. Production deployment is
    # handled by Cloudflare Pages, which runs its own `npm run build`
    # on every push to main (configured in the Cloudflare Pages
    # dashboard, not here). This job catches single-file-deploy
    # regressions before Cloudflare even sees them.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify dist/ contents (whitelist)
        # vite-plugin-singlefile inlines all imports into index.html. Web
        # Worker modules cannot be inlined (they're loaded via
        # `new Worker(new URL(...))`) and are emitted as separate chunks.
        # The vimathic-docs Vite plugin also emits the static docs site,
        # sitemap, robots.txt, and llms.txt.
        #
        # Full allowed dist/ contents. DEPLOYMENT.md, which this list used to
        # cite, was removed in 3a7b9db — the ALLOWED regex below is the spec:
        #   dist/index.html           ← main app, self-contained
        #   dist/second-screen.html   ← projector/2nd-monitor popup target
        #   dist/math-worker-*.js     ← Web Worker chunk(s)
        #   dist/vimathic-intro.mp3   ← bundled intro track (S. Melentyev)
        #   dist/support-hero.png     ← support page hero image (PNG fallback)
        #   dist/support-hero.webp    ← support page hero image (WebP, modern browsers)
        #   dist/sitemap.xml          ← SEO sitemap
        #   dist/robots.txt           ← AI crawler opt-in
        #   dist/llms.txt             ← LLM discoverability format
        #   dist/docs/                ← static documentation site
        #
        # Anything in dist/ root that's NOT on this whitelist means
        # something leaked from the inlining step — that's the regression
        # we want CI to catch.
        #
        # FIX(#37, r4): that was only half a spec, and the half that cannot
        # catch a broken deploy. The list forbade extra files and never asked
        # for the ones a deploy needs, so a build with no second screen, no
        # worker chunk, no docs site, no sitemap, no robots.txt and no llms.txt
        # went green — every producer of those files fails quietly by design
        # (copySecondScreen is wrapped in `if (fs.existsSync(src))`,
        # vimathicDocs.closeBundle() returns early with a console.warn), and the
        # other two steps cannot see it: the script grep only reads index.html,
        # and the size gate only bounds index.html, which stays over 1 MB with
        # every document dropped. So the spec is two-way now: the whitelist
        # above says what may be in dist/, and the loop below says what must be.
        # It asks for the files enumerated in this comment; the icons, the
        # manifest and og-image.png are allowed but not demanded, because
        # whether the favicon package ships at all is a separate open question.
        run: |
          set -e
          echo "=== dist/ root contents ==="
          ls -la dist/
          echo ""
          echo "=== Whitelist verification ==="
          ALLOWED='^(index\.html|second-screen\.html|math-worker-[A-Za-z0-9_-]+\.js|vimathic-intro\.mp3|support-hero\.png|support-hero\.webp|og-image\.png|favicon\.ico|favicon-(16|32|48)\.png|apple-touch-icon\.png|android-chrome-(192|512)\.png|site\.webmanifest|sitemap\.xml|robots\.txt|llms\.txt|docs)$'
          UNEXPECTED=$(find dist -maxdepth 1 -mindepth 1 -printf '%f\n' | grep -Ev "$ALLOWED" || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "❌ Unexpected files in dist/:"
            echo "$UNEXPECTED"
            echo ""
            echo "The single-file build guarantee is broken."
            echo "Add the new file to the ALLOWED regex above only if it genuinely belongs in dist/."
            exit 1
          fi
          echo "✅ All dist/ root entries are on the whitelist."
          echo ""
          echo "=== Required-files verification ==="
          MISSING=""
          for f in index.html second-screen.html vimathic-intro.mp3 \
                   support-hero.png support-hero.webp \
                   sitemap.xml robots.txt llms.txt docs/index.html; do
            [ -f "dist/$f" ] || MISSING="$MISSING $f"
          done
          # The worker chunk is content-hashed, so it is matched by shape — and
          # index.html has to name the chunk that was actually emitted. A build
          # that emits one hash while the bundle asks for another is a 404 at
          # runtime and looks identical to a healthy dist/ from a file listing.
          WORKERS=$(find dist -maxdepth 1 -name 'math-worker-*.js' -printf '%f\n')
          if [ -z "$WORKERS" ]; then
            MISSING="$MISSING math-worker-*.js"
          else
            REFERENCED=0
            for w in $WORKERS; do
              if grep -qF "$w" dist/index.html; then REFERENCED=1; fi
            done
            if [ "$REFERENCED" -eq 0 ]; then
              MISSING="$MISSING (index.html references no emitted math-worker chunk)"
            fi
          fi
          if [ -n "$MISSING" ]; then
            echo "❌ Missing from dist/:$MISSING"
            echo ""
            echo "The build succeeded without them, so nothing else will tell you."
            echo "Remove an entry from the list above only if the deploy genuinely no longer needs it."
            exit 1
          fi
          echo "✅ Every file the deploy needs is in dist/."

      - name: Verify index.html has no external script references
        # The whole point of single-file deploy is that index.html runs
        # offline. Any <script src="..."> pointing at an external URL
        # (or a separate JS chunk that should have been inlined) breaks
        # that. Worker imports via `new Worker(new URL(...))` are NOT
        # <script> tags so they don't match this grep. Data URLs are
        # excluded because they're inline-by-definition.
        run: |
          set -e
          EXTERNAL=$(grep -E '<script[^>]+src="[^"]+\.js"' dist/index.html | grep -v 'src="data:' || true)
          if [ -n "$EXTERNAL" ]; then
            echo "❌ index.html contains external <script src> references:"
            echo "$EXTERNAL"
            echo ""
            echo "Single-file deploy requires all JS to be inlined."
            exit 1
          fi
          echo "✅ No external <script src> references in index.html."

      - name: Verify index.html size is reasonable
        # Sanity check: if the build produces a 50 KB or 50 MB file,
        # something went wrong. Current build is ~1.1 MB; accept 300 KB to
        # 5 MB to catch regressions without being too strict.
        run: |
          set -e
          SIZE=$(stat -c%s dist/index.html)
          SIZE_KB=$((SIZE / 1024))
          echo "dist/index.html: $SIZE_KB KB ($SIZE bytes)"
          if [ "$SIZE" -lt 300000 ]; then
            echo "❌ index.html is suspiciously small (<300 KB). Build may be broken."
            exit 1
          fi
          if [ "$SIZE" -gt 5000000 ]; then
            echo "❌ index.html is suspiciously large (>5 MB). Something is being bundled that shouldn't be."
            exit 1
          fi
          echo "✅ Size is within expected range."
