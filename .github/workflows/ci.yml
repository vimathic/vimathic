name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Cancel any in-progress runs for the same PR/branch when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Math validation tests
    runs-on: ubuntu-latest
    # 10, not 5. The suite itself needs ~40 s locally and ran in 59 s here on
    # 03.09.2026 — and the very next run on the same commit range was killed at
    # 5m13s with nothing failed, because checkout + setup-node + `npm ci` had
    # eaten 4m27s of the budget before the first test printed. A budget sized
    # against the tests alone is a budget that fails on the runner's bad night,
    # and a job killed by its own budget reports nothing at all — which reads
    # like a product failure and is not one.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        # Runs every tests/*.test.js — the whole unit suite, not only the maths.
        # FIX(#44, r4): this comment used to state a fixed total, and it was
        # hundreds short by the time anyone read it. It is the only statement in
        # the workflow of what this required check covers, and the job's name
        # understates it too — but the name is what the branch-protection rule
        # matches on, so it cannot be corrected here alone. That left a reader
        # with a name and a number that both said "narrower than it is". The
        # scope is the glob; the count is whatever the run prints.
        # The largest single file is tests/math-validation.test.js, which
        # validates math-collections.js against canonical references
        # (scipy.special, mpmath, NIST DLMF).
        run: npm test

  e2e:
    name: Playwright e2e (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # Three shards, one worker each — NOT three workers in one job. The
    # single-worker setting in playwright.config.js is there because a GPU-less
    # runner falls back to SwiftShader and parallel WebGL contexts starve each
    # other; sharding buys the same wall clock without putting two scenes on one
    # CPU. fail-fast is off so a red shard does not cancel the other and cost us
    # half the signal.
    #
    # Why this had to change (03.09.2026): the suite stopped fitting in the job
    # budget. Measured on this repo's own runs — 31.08 green in 13.8 min, 01.09
    # onwards over budget, and the run for the branch this comment landed on was
    # killed at 30m16s with every test that had run PASSED and none failed.
    # (No count here on purpose: the guard in tests/build-pipeline-guards.test.js
    # reads from `- name: Run tests` to the next step and forbids a hand-written
    # total anywhere in between, because such a total goes stale the day the
    # next spec lands. It caught this comment's first draft.)
    # Three things added up, and only the last one is a defect worth chasing:
    #   • the suite grew (six night-hotkey tests here, clip-camera's 8 s holds
    #     before that);
    #   • a frame costs ~20 % more under SwiftShader since the band layer —
    #     measured 167 ms → 200 ms per frame with no GPU, and 16.7 ms with one,
    #     i.e. 60 FPS on every build. Real devices do not pay this; runners do;
    #   • a job killed by its own budget reports nothing, which reads like a
    #     product failure and is not one — the same trap the 15-minute budget
    #     sprang before.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # This is the JOB budget, now per shard. The PER-TEST budget is in
    # playwright.config.js and is a different number for CI — the two are sized
    # against each other, so move them together.
    #
    # 40 per shard. It has to cover the worst RED run, not the green one: with
    # the per-test budget at 240 s and one retry, three failures cost
    # 3 × 2 × 240 s = 24 min before the maxFailures bail, on top of whatever
    # passed first. The green run is far under this — the slowest shard took
    # 20 min on 03.09, on a runner measurably slower than the same day's
    # morning one. Move this number with the per-test one in
    # playwright.config.js; they are sized against each other.
    timeout-minutes: 40
    # continue-on-error was removed here: it had been masking a real product
    # regression (RESET ALL restored colour scheme 0 instead of 16) plus three
    # tests that no longer matched the UI, so the suite was red and nobody saw
    # it. The suite passes again — how many tests that is, the run prints, for
    # the same reason the unit job above stopped stating a total: any number
    # written here goes stale and then misleads. Hosted runners have no GPU
    # either, so the single-worker setting in playwright.config.js is what
    # keeps them stable.
    # Restore this line only as a deliberate, temporary decision — not as the
    # default place for e2e to live.
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/3

  # The name below is load-bearing: branch protection matches required checks by
  # NAME, so sharding the job above would have silently removed the check `main`
  # requires — the PR would then wait forever on something that can no longer
  # report. This job keeps that name alive and fails when any shard failed.
  # `if: always()` is what makes it run after a red shard at all; without it the
  # required check would go missing exactly when it matters.
  e2e-result:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: e2e
    if: always()

    steps:
      - name: Collect shard results
        run: |
          echo "shards: ${{ needs.e2e.result }}"
          test "${{ needs.e2e.result }}" = "success"

  build:
    name: Vite build (single-file)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test

    # Build job runs as CI verification only. Production deployment is
    # handled by Cloudflare Pages, which runs its own `npm run build`
    # on every push to main (configured in the Cloudflare Pages
    # dashboard, not here). This job catches single-file-deploy
    # regressions before Cloudflare even sees them.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify dist/ contents (whitelist)
        # vite-plugin-singlefile inlines all imports into index.html. The math
        # Web Worker used to be the one exception — `new Worker(new URL(...))`
        # can only be given a URL, so Vite emitted it as a separate chunk — and
        # it is now inlined too: main.js imports it as `?worker&inline`, which
        # embeds the worker's own bundle in index.html as a string and starts it
        # from a blob: URL. So math-worker-*.js in dist/ is no longer expected,
        # it is a REGRESSION, and the whitelist below is what says so.
        # The vimathic-docs Vite plugin also emits the static docs site,
        # sitemap, robots.txt, and llms.txt.
        #
        # Full allowed dist/ contents. DEPLOYMENT.md, which this list used to
        # cite, was removed in 3a7b9db — the ALLOWED regex below is the spec:
        #   dist/index.html           ← main app, self-contained (worker included)
        #   dist/second-screen.html   ← projector/2nd-monitor popup target
        #   dist/vimathic-intro.mp3   ← bundled intro track (S. Melentyev)
        #   dist/support-hero.png     ← support page hero image (PNG fallback)
        #   dist/support-hero.webp    ← support page hero image (WebP, modern browsers)
        #   dist/sitemap.xml          ← SEO sitemap
        #   dist/robots.txt           ← AI crawler opt-in
        #   dist/llms.txt             ← LLM discoverability format
        #   dist/docs/                ← static documentation site
        #
        # Anything in dist/ root that's NOT on this whitelist means
        # something leaked from the inlining step — that's the regression
        # we want CI to catch.
        #
        # FIX(#37, r4): that was only half a spec, and the half that cannot
        # catch a broken deploy. The list forbade extra files and never asked
        # for the ones a deploy needs, so a build with no second screen, no
        # docs site, no sitemap, no robots.txt and no llms.txt
        # went green — every producer of those files fails quietly by design
        # (copySecondScreen is wrapped in `if (fs.existsSync(src))`,
        # vimathicDocs.closeBundle() returns early with a console.warn), and the
        # other two steps cannot see it: the script grep only reads index.html,
        # and the size gate only bounds index.html, which stays over 1 MB with
        # every document dropped. So the spec is two-way now: the whitelist
        # above says what may be in dist/, and the loop below says what must be.
        # It asks for the files enumerated in this comment; the icons, the
        # manifest and og-image.png are allowed but not demanded, because
        # whether the favicon package ships at all is a separate open question.
        run: |
          set -e
          echo "=== dist/ root contents ==="
          ls -la dist/
          echo ""
          echo "=== Whitelist verification ==="
          ALLOWED='^(index\.html|second-screen\.html|vimathic-intro\.mp3|support-hero\.png|support-hero\.webp|og-image\.png|favicon\.ico|favicon-(16|32|48)\.png|apple-touch-icon\.png|android-chrome-(192|512)\.png|site\.webmanifest|sitemap\.xml|robots\.txt|llms\.txt|docs)$'
          UNEXPECTED=$(find dist -maxdepth 1 -mindepth 1 -printf '%f\n' | grep -Ev "$ALLOWED" || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "❌ Unexpected files in dist/:"
            echo "$UNEXPECTED"
            echo ""
            echo "The single-file build guarantee is broken."
            echo "Add the new file to the ALLOWED regex above only if it genuinely belongs in dist/."
            exit 1
          fi
          echo "✅ All dist/ root entries are on the whitelist."
          echo ""
          echo "=== Required-files verification ==="
          MISSING=""
          for f in index.html second-screen.html vimathic-intro.mp3 \
                   support-hero.png support-hero.webp \
                   sitemap.xml robots.txt llms.txt docs/index.html; do
            [ -f "dist/$f" ] || MISSING="$MISSING $f"
          done
          # The math worker: the demand is now the OPPOSITE of what it was.
          # It has to be INSIDE index.html and NOT beside it. Both halves are
          # asked, because each catches a different way of losing the fix:
          #
          #   * a math-worker-*.js back in dist/ means `?worker&inline` stopped
          #     applying (a refactor back to `new Worker(new URL(...))`, or a
          #     Vite change) — the whitelist above already fails on it, and this
          #     message is the one that says why;
          #   * index.html without the worker's own code in it means the import
          #     was dropped altogether. That failure is silent at build time and
          #     at load time: the app falls back to computing every surface
          #     frame on the main thread and only feels slow.
          #
          # The grep looks for a string the worker's protocol owns and nothing
          # else in the tree contains (src/math-worker.js, "Unknown message
          # type"). Minifiers rename identifiers; they do not rewrite string
          # literals. Checked against a build that predates the inlining: the
          # string is in the chunk and NOT in index.html, so this is a check
          # that can fail.
          if find dist -maxdepth 1 -name 'math-worker-*.js' | grep -q .; then
            MISSING="$MISSING (a separate math-worker-*.js is back in dist/ — it belongs inside index.html)"
          fi
          if ! grep -qF 'Unknown message type' dist/index.html; then
            MISSING="$MISSING (index.html does not contain the inlined math worker)"
          fi
          if [ -n "$MISSING" ]; then
            echo "❌ Missing from dist/:$MISSING"
            echo ""
            echo "The build succeeded without them, so nothing else will tell you."
            echo "Remove an entry from the list above only if the deploy genuinely no longer needs it."
            exit 1
          fi
          echo "✅ Every file the deploy needs is in dist/."

      - name: Verify index.html has no external script references
        # The whole point of single-file deploy is that index.html runs
        # offline. Any <script src="..."> pointing at an external URL
        # (or a separate JS chunk that should have been inlined) breaks
        # that. Data URLs are excluded because they're inline-by-definition.
        # The math worker never matched this grep in either shape — it was
        # never a <script> tag — which is why the step above checks for it
        # by its own means.
        run: |
          set -e
          EXTERNAL=$(grep -E '<script[^>]+src="[^"]+\.js"' dist/index.html | grep -v 'src="data:' || true)
          if [ -n "$EXTERNAL" ]; then
            echo "❌ index.html contains external <script src> references:"
            echo "$EXTERNAL"
            echo ""
            echo "Single-file deploy requires all JS to be inlined."
            exit 1
          fi
          echo "✅ No external <script src> references in index.html."

      - name: Verify index.html size is reasonable
        # Sanity check: if the build produces a 50 KB or 50 MB file,
        # something went wrong. Current build is ~1.1 MB; accept 300 KB to
        # 5 MB to catch regressions without being too strict.
        run: |
          set -e
          SIZE=$(stat -c%s dist/index.html)
          SIZE_KB=$((SIZE / 1024))
          echo "dist/index.html: $SIZE_KB KB ($SIZE bytes)"
          if [ "$SIZE" -lt 300000 ]; then
            echo "❌ index.html is suspiciously small (<300 KB). Build may be broken."
            exit 1
          fi
          if [ "$SIZE" -gt 5000000 ]; then
            echo "❌ index.html is suspiciously large (>5 MB). Something is being bundled that shouldn't be."
            exit 1
          fi
          echo "✅ Size is within expected range."
